name: Snap Package & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Snap store channel to release to (edge, beta, candidate, stable)'
        required: true
        default: 'edge'

jobs:
  build-and-publish-snap:
    name: Build & Publish Snap
    runs-on: ubuntu-22.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build snap package
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamore-snap
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Publish to Snap Store
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: ${{ github.event.inputs.channel || (startsWith(github.ref, 'refs/tags/v') && 'stable') || 'edge' }}

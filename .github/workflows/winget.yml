name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 2.2.0)'
        required: false
        default: ''

jobs:
  publish-winget:
    name: Submit to Windows Package Manager (winget)
    runs-on: windows-latest
    steps:
      - name: Publish to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NuwanWimalasena.Dynamore
          token: ${{ secrets.WINGET_TOKEN }}
          version: ${{ github.event.inputs.version }}

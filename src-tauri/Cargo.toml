[package]
name = "dynamore"
version = "2.0.0"
description = "A sleek, high-performance DynamoDB desktop client"
authors = ["Nuwan Wimalasena <nuwan@example.com>"]
license = "MIT"
repository = "https://github.com/nuwanwimalasena/dynamore"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
aws-config = "1.1"
aws-sdk-dynamodb = "1.23"
aws-sdk-sso = "1.21"
aws-sdk-ssooidc = "1.21"
aws-sdk-sts = "1.21"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
open = "5.3.5"
aws-credential-types = "1.2.10"
